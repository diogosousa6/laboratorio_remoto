 
    
<html>
   <body>
      
      {% with messages = get_flashed_messages() %}
         {% if messages %}
              <ul class="flashes">
                 {% for message in messages %}
                  <div class="message_flash">{{ message }}</div>
                 {% endfor %}
             </ul>
         {% endif %}
      {% endwith %}
  
      
      <form method = "POST" enctype = "multipart/form-data">
         <input type = "file" name = "file" />
         <input type = "submit" value=Programar> 
      </form>   
   </body>
</html>
