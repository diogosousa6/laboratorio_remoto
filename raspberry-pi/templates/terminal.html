<!doctype html>
<html>
<head>
<link rel="shortcut icon" href="/static/favicon.ico">
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratório Remoto de Microcontroladores</title>
<link href="static/css/sub_main.css" rel="stylesheet" type="text/css">

<!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      

   <h5>Terminal Serie</h5>
   
  
   <div class="txt_area">

       <textarea id="upload_log" name="upload_log" readonly style="background-color:#F2F3F4;"> {{SerialLog}} </textarea>

   </div>
   
  <div class="serial_terminal_form">
    
	<form method = "POST" enctype = "multipart/form-data">
	  <input type="text" id="fname" name="TXsend" class="file_form">
	  <input type="submit" value="Send" class="file_form">
	</form>
  </div>
	
  <div class="serial_terminal_form">
	<form method = "POST" enctype = "multipart/form-data">
	  <input type="submit" name="CLRconsole" value="CLR Console" class="file_form">
	</form>
  </div>   

  <div class="serial_terminal_form">
    <form method = "POST" enctype = "multipart/form-data">
        <label>Baud Rate: </label>
        <input name="BaudRateChange" list="BaudRate" onfocus="this.value=''" onchange="this.blur();" value= {{SerialBaudRate}} class="file_form" width="48px">
        <datalist id="BaudRate" >		
			{% for Baud in BaudRateList %}
				<option value={{ BaudRateList[Baud] }} &nbsp; bps />
			{% endfor %}
        </datalist>
        <button style="background: #ABEBC6; color: black; border-radius: 5px;" type="submit" class="upload_button">
             <i style="background: #ABEBC6; color: black;" class="fa fa-check-circle fa-1x"></i> 
        </button>
    </form>
   </div>

<script>
    var latest = document.getElementById('upload_log');

    var xhr = new XMLHttpRequest();
    var inst = setInterval(change, 300);
    
    
	function change() {
		xhr.open('GET', '{{ url_for('serial_feed', token=Token) }}');

		
		xhr.onload = function() {
			latest.textContent = xhr.responseText;
		}

		xhr.send();	

	}
    




</script>

</html>
